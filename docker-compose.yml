services:
  db:
    image: postgres:16-alpine
    container_name: fun-zone-arena-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: gw_challenge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gw_challenge"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - gw_word_puzzle_pgdata:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fun-zone-arena-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgres://postgres:postgres@db:5432/gw_challenge
      PGSSLMODE: disable
      PGPOOL_MAX: 4
      CODE_HASH_SECRET: local-dev-code-hash-secret-at-least-32-characters
      ADMIN_API_KEY: local-dev-admin-api-key-at-least-32-characters
      ATTEMPT_TOKEN_SALT: local-dev-attempt-token-salt-at-least-32-characters
      IP_HASH_SALT: local-dev-ip-hash-salt-at-least-32-characters
      CHALLENGE_ID: fun-zone-arena-2026
      CHALLENGE_TITLE: Fun Zone Arena Local Docker Challenge
      CHALLENGE_START_AT: 2026-01-01T00:00:00Z
      CHALLENGE_END_AT: 2027-01-01T00:00:00Z
      CHALLENGE_STATUS: active
      SYNC_CHALLENGE_WINDOW: "true"
      ACCEPT_LATE_SUBMISSIONS: "false"
      RUN_MIGRATIONS_ON_START: "true"
      ENABLE_ADMIN_RESET: "true"
      ALLOW_SEED_CODES_FROM_ENV: "true"
      SEED_CHALLENGE_CODES: FZADEMO0001,FZADEMO0002,FZADEMO0003,FZADEMO0004,FZADEMO0005

volumes:
  gw_word_puzzle_pgdata:
